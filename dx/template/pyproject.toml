[tool.poetry]
name = "starter"
version = "0.1.0"
description = ""
authors = ["Tom Stadelmann <tom-010@web.de>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
rich = "^13.9.4"
tqdm = "^4.66.6"
python-dotenv = "^1.0.1"
django = "^5.1.3"
django-ninja = "^1.3.0"
django-cors-headers = "^4.6.0"
django-db-logger = "^0.1.13"
django-celery-beat = "^2.7.0"
psycopg2-binary = "^2.9.10"
django-save-deep = "^0.0.2"
django-click = "^2.4.0"
redis = "^5.2.0"
flower = "^2.0.1"
ninja-schema = "^0.13.6"
psutil = "^6.1.0"
django-dbbackup = "^4.2.1"
django-ninja-jwt = "^5.3.5"
django-health-check = "^3.20.0"
celery-progress = "^0.5"
pillow = "^12.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-django = "^4.9.0"
coverage = "^7.6.4"
pytest-cov = "^6.0.0"
jupyter = "^1.1.1"
detect-secrets = "^1.5.0"
cookiecutter = "^2.6.0"
ruff = "^0.13.0"
mypy = "^1.18.1"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = '--strict-markers --reuse-db --tb=short --no-migrations'
markers = [
    "api: marks tests as slow (deselect with '-m \"not api\"')",
    "infra: not critical for the app itself but dev-tooling (deselect with '-m \"not infra\"')",
    "serial",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
fail_under = 0 # If you want to...
exclude_also = [
    "def __str__",
    "def __repr__",
]

[tool.coverage.run]
omit = [
    "config/*",
    "manage.py",
    "*/migrations/*",
    "*/tests/*",
    "*_test.py",
    "test_*.py",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


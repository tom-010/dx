# Dev infrastructure. `db`, `pgbouncer`, `redis`, `s3` and `opensearch` are always started; `app` + `worker`
# (the built image) only with `--profile app`.
name: dx

# Environment of the bundled image (`app` and `worker`, --profile app).
x-app-env: &app_env
  # Runtime role for gunicorn/workers; the entrypoint migrates as the owner (DB_MIGRATOR_*).
  # DATABASE_URL is Postgres itself, DATABASE_POOL_URL the pooler — only `app` connects there
  # (DB_POOLED below); the worker needs a real session.
  DATABASE_URL: postgres://app_user:app_user@db:5432/dx
  DATABASE_POOL_URL: postgres://app_user:app_user@pgbouncer:6432/dx
  DB_MIGRATOR_USER: dx
  DB_MIGRATOR_PASSWORD: dx
  CACHE_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://s3:9000
  S3_ACCESS_KEY: dx
  S3_SECRET_KEY: dxdxdxdx
  S3_BUCKET: dx-media
  OPENSEARCH_URL: http://opensearch:9200
  DEBUG: "false"
  ALLOWED_HOSTS: '["localhost"]'
  # Plain http on :8080 — the production image refuses to start otherwise (docker/entrypoint.sh
  # runs `check --deploy`). Real values: docker/.env.prod.example + docker-compose.prod.yml.
  SECRET_KEY: dev-compose-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
  HTTPS_ONLY: "false"
  EMAIL_URL: dummy://

services:
  # `dx` is the bootstrap superuser (dev migrator: creates the test database, runs migrations).
  # docker/postgres/10-roles.sh adds the application roles — app_migrator (owns the tables),
  # app_user (the runtime role row-level security applies to; DATABASE_URL), app_admin
  # (BYPASSRLS for shell_admin), pgbouncer (the pooler's password lookup, nothing else) — on a
  # fresh volume, and ./scripts/db.sh re-runs it on every start for existing volumes. Dev
  # passwords = role names.
  db:
    image: postgres:18-alpine
    # 100 (the default) is thin for a dev box. The web process no longer counts here (it comes
    # in through `pgbouncer`: at most 25 backends for all of its threads), but the worker, a
    # shell or two and `./scripts/test.sh`'s eight parallel workers with their own test
    # databases share it with the pooler's 25, and running out shows up as "sorry, too many
    # clients already" in whatever asked last.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: dx
      POSTGRES_PASSWORD: dx
      POSTGRES_DB: dx
      APP_MIGRATOR_PASSWORD: app_migrator
      APP_USER_PASSWORD: app_user
      APP_ADMIN_PASSWORD: app_admin
      PGBOUNCER_PASSWORD: pgbouncer
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dx -d dx"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Connection pooler in front of `db` (PgBouncer, transaction pooling). The web process holds
  # its client connections here — thousands are cheap, one costs PgBouncer a few kB and no
  # Postgres backend — and every transaction borrows one of a small pool of real connections
  # for its duration. **Only the web process uses it** (DB_POOLED, backend/config/env.py;
  # backend/scripts/serve.sh sets it for runserver): transaction pooling drops session state
  # after every commit, and the Celery worker (pins its tenant per session), the shells,
  # backups and the test suite (creates and drops databases) all need a real session, so they
  # connect to `db` directly. Same numbers as production so dev behaves the same —
  # docker-compose.prod.yml explains them.
  # Authentication: a client logs in with its own Postgres password (SCRAM) and PgBouncer checks
  # it against the secret Postgres holds, fetched through the `pgbouncer` role and its lookup
  # function (docker/postgres/10-roles.sh) — no second copy of any password here. The lookup
  # refuses superusers and BYPASSRLS roles, so nothing that bypasses row-level security can come
  # through the pooler. Pools/clients/stats:
  #   ./scripts/db.sh exec -e PGPASSWORD=pgbouncer pgbouncer psql -h 127.0.0.1 -p 6432 -U pgbouncer pgbouncer -c 'SHOW POOLS'
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: dx
      # The lookup role's own credentials — the one entry in PgBouncer's user list; every
      # other user is verified through AUTH_QUERY.
      DB_USER: pgbouncer
      DB_PASSWORD: pgbouncer
      AUTH_TYPE: scram-sha-256
      AUTH_QUERY: SELECT uname, phash FROM pgbouncer.user_lookup($$1)
      ADMIN_USERS: pgbouncer
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "10000"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "60"
      SERVER_RESET_QUERY_ALWAYS: "1"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      # Silent on success (CLAUDE.md "Logging"): no line per client login/logout — with a
      # connection per request that would be two per request — and no stats every minute
      # (`SHOW STATS` on the console has them). Pooler errors are still logged.
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      LOG_STATS: "0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "6432:6432"
    healthcheck:
      # The admin database, as the user PgBouncer knows by itself: answers without Postgres.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "pgbouncer", "-d", "pgbouncer"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  # Celery broker + result store (Valkey is the open-source Redis fork; same protocol).
  # Persistent: the append-only file is fsynced every second and lives in the `valkeydata`
  # volume, so queued tasks and results survive a container restart (`db.sh down -v` wipes it).
  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store for uploaded files (Django's default storage, see CLAUDE.md
  # "File storage"). RustFS: Apache-2.0 MinIO drop-in with bucket versioning; MinIO itself stopped
  # publishing community images in 2025. Console: http://localhost:9101 (login dx / dxdxdxdx).
  # Host ports are 9100/9101 (not 9000/9001) to stay clear of Hadoop & friends.
  # The bucket + versioning are created by `manage.py ensure_bucket` (./scripts/db.sh runs it).
  s3:
    image: rustfs/rustfs:1.0.0-rc.3
    environment:
      RUSTFS_ACCESS_KEY: dx
      RUSTFS_SECRET_KEY: dxdxdxdx
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9100:9000"  # S3 API
      - "9101:9001"  # web console
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Search engine (apps/search): one index per tenant, OpenSearch's German/English analyzers,
  # exact k-NN over the Gemini embeddings, highlighting and typeahead. Postgres stays the truth
  # — the pg projection (`search_root`/`search_unit`) is canonical and every index here is
  # disposable, rebuilt in seconds by `manage.py rebuild_search --reindex`. Sized for a laptop:
  #   - one node, one shard and no replicas per index (the app creates them that way);
  #   - a 512 MB heap (the full distribution — k-NN, analysis plugins, dashboards' backends — does
  #     not boot reliably below that; Serial GC because there is nothing to parallelize);
  #   - the security plugin off (plain http, no password: dev only, port bound to localhost);
  #   - the performance analyzer agent off (a second JVM otherwise);
  #   - the disk watermarks off (a laptop disk over 85% full would otherwise turn every index
  #     read-only, which reads like a bug in the app).
  # Production needs the security plugin (TLS + a password) and its own decision on sizing.
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m -XX:+UseSerialGC"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      # Indices are created explicitly with their mapping (apps/search/opensearch.py); a typo in
      # an index name must not quietly create an unmapped one.
      action.auto_create_index: "false"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # The bundled image (frontend + backend). Build it with ./scripts/build.sh.
  app:
    profiles: ["app"]
    image: dx-app:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      <<: *app_env
      # gunicorn's threads connect through the pooler; the worker below does not.
      DB_POOLED: "true"
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=8)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # Celery worker: same image, same env, different command. Starts once `app` is healthy, i.e.
  # after the entrypoint applied the migrations (only the web process migrates).
  worker:
    profiles: ["app"]
    image: dx-app:latest
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *app_env
    healthcheck:
      # -d: `inspect ping` is a broadcast, so without it any worker on the broker answers.
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
  s3data:
  osdata:
